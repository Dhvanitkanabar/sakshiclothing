<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgCust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1C19" />
      <stop offset="100%" stop-color="#0F0E0C" />
    </linearGradient>
    <linearGradient id="goldCust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glowCust" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background luxury container -->
  <rect width="128" height="128" rx="28" fill="url(#bgCust)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- S Monogram -->
  <text x="64" y="86" font-family="Georgia, serif" font-size="78" font-weight="bold" fill="url(#goldCust)" text-anchor="middle" filter="url(#glowCust)">S</text>
  <text x="64" y="86" font-family="Georgia, serif" font-size="78" font-weight="bold" fill="url(#goldCust)" text-anchor="middle">S</text>
  
  <!-- Couture Amber Jewel Dot -->
  <circle cx="88" cy="38" r="6" fill="#F59E0B" opacity="0.6" filter="url(#glowCust)" />
  <circle cx="88" cy="38" r="4.5" fill="#F59E0B" />
  <circle cx="87" cy="37" r="1.8" fill="#FEF3C7" />
</svg>
