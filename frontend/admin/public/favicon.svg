<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glowAdmin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background luxury container -->
  <rect width="128" height="128" rx="28" fill="url(#bgAdmin)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Atelier Geometric Crown Crest -->
  <polygon points="46,30 46,24 55,27 64,20 73,27 82,24 82,30" fill="url(#goldAdmin)" />
  <circle cx="46" cy="23" r="1.8" fill="#FEF08A" />
  <circle cx="64" cy="19" r="2.2" fill="#FEF08A" />
  <circle cx="82" cy="23" r="1.8" fill="#FEF08A" />

  <!-- S Monogram -->
  <text x="64" y="94" font-family="Georgia, serif" font-size="68" font-weight="bold" fill="url(#goldAdmin)" text-anchor="middle" filter="url(#glowAdmin)">S</text>
  <text x="64" y="94" font-family="Georgia, serif" font-size="68" font-weight="bold" fill="url(#goldAdmin)" text-anchor="middle">S</text>

  <!-- ATELIER Micro Badge -->
  <rect x="36" y="104" width="56" height="13" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1" />
  <text x="64" y="113.5" font-family="sans-serif" font-size="7.5" font-weight="bold" letter-spacing="1.5" fill="#FDE68A" text-anchor="middle">ATELIER</text>
</svg>